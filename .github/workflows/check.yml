name: Verify skill and quiz
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/grading.test.cjs
      - run: python skills/buct-finalhelp/scripts/build_quiz.py examples/demo-bank.json --output /tmp/finalhelp-demo.html
